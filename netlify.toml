# Netlify configuration
# Deploy: Add new project > Import an existing project > GitHub > this repo (publish directory ".").
# Forms: in the project, open Forms > Enable form detection, then redeploy once. Netlify finds the
# "quote" form in index.html. Then Forms > Submission notifications > Add notification > Email, and
# enter shreeradhe.steel.alloys@gmail.com (it must be a member of the Netlify team).

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # NOTE: if you edit an inline <script> in index.html, regenerate its sha256 hash below.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com 'sha256-wJftGPHOQTfkwfkuRfYrkJw50AJ0C9vcRb47mBXexAQ=' 'sha256-PJuPofc3VlYWTUNXN9BXKt1IhI2wg5qUvxVGhJE5x5k='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cdn.jsdelivr.net; frame-src https://www.google.com https://maps.google.com; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/docs/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# The archived first version stays in the repo but is not served on Netlify
[[redirects]]
  from = "/v1/*"
  to = "/"
  status = 301
  force = true
